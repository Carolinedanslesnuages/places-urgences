name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carte:
    name: Carte (lint, types, tests dont accessibilité, compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build-only

  accessibilite:
    name: Accessibilité RGAA (pages construites)
    # Ubuntu 24.04 : le Playwright d'Emmanuelle ne prend pas encore en charge Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build-only
      # Lien d'évitement, focus visible, 320 px, zoom, espacement du texte, axe-core : chaque constat
      # rangé par critère du RGAA. Défauts connus et justifiés : .emmanuelle-reference.json.
      - uses: Carolinedanslesnuages/emmanuelle@dd6ac2e0319b7f8b13c61d1af6b2c810dee0f485 # v1.1.0
        with:
          dossier: dist
          pages: "/"
          # Application monopage : chaque adresse de la liste reçoit index.html, comme chez l'hébergeur.
          monopage: "true"
